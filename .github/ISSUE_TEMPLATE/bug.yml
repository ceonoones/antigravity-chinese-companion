name: 问题报告
description: 报告汉化、恢复原文或兼容问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传个人信息、对话正文、电脑名、目录路径、令牌或完整配置。安全漏洞请使用 Security 中的私密报告入口。
  - type: input
    id: versions
    attributes:
      label: 版本
      placeholder: 伴侣 v0.1.0 / 客户端 2.29.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最短复现步骤
      description: 从哪个页面开始、进行哪些操作、在哪一步出现问题？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
      description: 请说明恢复英文后问题是否仍存在，示例需要脱敏。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已移除个人信息、电脑信息和凭据。
          required: true
