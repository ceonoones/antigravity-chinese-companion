name: 功能建议
description: 提出有具体使用场景的改进
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 请描述具体场景，示例需去除个人和设备信息。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案及替代方案
    validations:
      required: true
