name: 测试与构建
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: 项目检查与显示层测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
  build:
    name: Windows 编译与打包
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 验证 Windows PowerShell 构建
        shell: powershell
        run: .\build.ps1
      - name: 打包与校验
        shell: pwsh
        run: |
          $agVersion = (Get-Content version.txt -Raw).Trim()
          if ($agVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $agArchive = "antigravity-chinese-companion-v$agVersion-windows.zip"
          Compress-Archive -LiteralPath 'dist/Antigravity中文伴侣' -DestinationPath "dist/$agArchive" -Force
          $agHash = (Get-FileHash -LiteralPath "dist/$agArchive" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Value "$agHash  $agArchive" -Encoding utf8NoBOM
      - name: 保存构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          retention-days: 14
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
